name: GitVerse CI with Local Runner

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run_tests:
    runs-on: self-hosted
    steps:
      - name: 📥 Чекаут кода
        uses: actions/checkout@v4

      - name: 🔧 Подготовка окружения
        run: |
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Запуск тестов
        run: |
          .\venv\Scripts\Activate.ps1
          pytest tests/ --alluredir=./allure-results --clean-alluredir -v
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: 📊 Генерация Allure HTML
        if: always()
        run: allure generate ./allure-results -o ./allure-report --clean

      - name: 📤 Загрузка отчета в артефакты
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: ./allure-report

      - name: 📥 Скачивание артефакта для Pages
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./pages-artifact

      - name: 📤 Загрузка в GitVerse Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-artifact

      - name: 🚀 Публикация на GitVerse Pages
        if: always()
        uses: actions/deploy-pages@v4

      - name: 🔗 Ссылка на Allure Отчет
        if: success()
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.gitverse.site/${{ github.event.repository.name }}/"
          echo "Отчет успешно опубликован!"
          echo "Открыть Allure: $REPORT_URL"