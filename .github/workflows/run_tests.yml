name: Automated tests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose target
        required: true
        default: second_test
        type: choice
        options:
          - first_test
          - second_test
          - all

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install Chrome
        run: sudo apt-get install google-chrome-stable
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Этот шаг не нужен здесь, т.к. мы ещё ничего не загружали
      # - name: Download all workflow run artifacts
      #   uses: actions/download-artifact@v4
      - name: Run first_test
        if: github.event.inputs.deployment_target == 'first_test'
        run: pytest tests/test_button.py::test_button_exist --alluredir=allure-results
        continue-on-error: true
      - name: Run second_test
        if: github.event.inputs.deployment_target == 'second_test'
        run: pytest tests/test_button.py::test_button_exist_2 --alluredir=allure-results
        continue-on-error: true
      - name: Run all tests
        if: github.event.inputs.deployment_target == 'all'
        run: pytest --alluredir=allure-results
        continue-on-error: true
      - name: Store Allure results 📦
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  generate-report:
    needs: test
    runs-on: ubuntu-latest
    name: Generate report ✨

    steps:
      - name: Setup Java for Allure CLI
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Install Allure CLI 🛠️
        run: |
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.44.0/allure-2.44.0.tgz && \
            sudo tar -zxvf allure-2.44.0.tgz -C /opt/ && \
            sudo ln -sf /opt/allure-2.44.0/bin/allure /usr/local/bin/allure
      # Мы удаляем этот шаг, так как нам нужно только то, что было загружено на этапе test
      # - name: Download all workflow run artifacts
      #   uses: actions/download-artifact@v4
      - name: Generate Allure Report ⚙️
        run: |
          mkdir -p ./_site
          # Используем полный путь до результатов для надёжности
          allure generate --clean ${{ github.workspace }}/allure-results -o _site
      - name: Store generated report 📦
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
          retention-days: 1

  publish-report:
    needs: generate-report
    runs-on: ubuntu-latest
    name: Publish to GitHub Pages 🌐

    steps:
      # Здесь тоже можно убрать download-artifact, но я оставил его для перестраховки
      # - name: Download all workflow run artifacts
      #   uses: actions/download-artifact@v4
      - name: Upload Pages artifact 🗄️
        uses: actions/upload-pages-artifact@v3
        with:
          # Отчёт уже лежит в _site, поэтому просто указываем эту папку
          path: _site
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4