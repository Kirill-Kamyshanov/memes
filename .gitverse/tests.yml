name: GitVerse CI with Local Runner

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Чекаут кода
        uses: actions/checkout@v4

      - name: 🔧 Подготовка окружения
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Запуск тестов
        run: |
          source venv/bin/activate
          pytest tests/ --alluredir=./allure-results --clean-alluredir -v
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: 📊 Генерация Allure HTML
        if: always()
        run: |
          source venv/bin/activate
          allure generate ./allure-results -o ./allure-report --clean

      - name: 🚀 Публикация в GitVerse Pages (ветка gh-pages)
        if: always()
        env:
          GIT_AUTH_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          rm -rf /tmp/allure-report

#           2. Копируем отчет во временную папку
          cp -r ./allure-report /tmp/allure-report

          # 3. Настраиваем Git
          git config --global user.name "GitVerse CI"
          git config --global user.email "ci@gitverse.ru"

          # 4. Переключаемся на ветку gh-pages (создаём, если нет)
          git checkout -B gh-pages

          # 5. Удаляем все файлы в корне (кроме .git)
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

          # 6. Копируем содержимое отчета в корень
          cp -r /tmp/allure-report/* .

          # 7. Добавляем и коммитим
          git add .
          git commit -m "Deploy Allure Report to Pages" || echo "Nothing to commit"

          # 8. Пушим с токеном
          git push https://${{ secrets.SECRET_TOKEN }}@gitverse.ru/Kirill-Kamyshanov/memes gh-pages --force

      - name: 🔗 Ссылка на Allure Отчет
        if: always()
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.gitverse.site/${{ github.event.repository.name }}/"
          echo "Отчет успешно опубликован!"
          echo "Открыть Allure: $REPORT_URL"
          echo "Ссылка на отчет: $REPORT_URL"