name: GitVerse CI with Local Runner

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run_tests:
    tags:
      img-ubuntu-20.04
    runs-on: self-hosted
    steps:
      - name: 📥 Чекаут кода
        uses: actions/checkout@v4

      - name: 🔧 Подготовка окружения
        run: |
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Запуск тестов
        run: |
          .\venv\Scripts\Activate.ps1
          pytest tests/ --alluredir=./allure-results --clean-alluredir -v
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: 📊 Генерация Allure HTML
        if: always()
        run: allure generate ./allure-results -o ./allure-report --clean

      - name: 📤 Загрузка отчета в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report

      - name: Загрузка отчета в GitVerse Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.SECRET_TOKEN }}
          publish_dir: ./allure-report

      - name: 🔗 Ссылка на Allure Отчет
        if: success()
        run: |
          $REPORT_URL = "https://${{ github.repository_owner }}.gitverse.site/${{ github.event.repository.name }}/"
          Write-Output "Open Allure-report: $REPORT_URL"
