name: GitVerse CI with Local Runner

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run_tests:
#    tags:
#      img-ubuntu-20.04 # Здесь мы указываем label твоего поднятого раннера
#    runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Чекаут кода
        uses: actions/checkout@v4

      - name: 🔧 Подготовка окружения
        run: |
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Запуск тестов
        run: |
          .\venv\Scripts\Activate.ps1
          pytest tests/ --alluredir=./allure-results --clean-alluredir -v
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: 📊 Генерация Allure HTML
        if: always()
        run: allure generate ./allure-results -o ./allure-report --clean

      - name: 🚀 Публикация в GitVerse Pages (ветка gh-pages )
        if: always()
        env:
          GIT_AUTH_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          Remove-Item -Recurse -Force /tmp/allure-report
          Copy-Item -Recurse ./allure-report /tmp/allure-report
          git config --global user.name "GitVerse CI"
          git config --global user.email "ci@gitverse.ru"
          git checkout -B gh-pages
          Get-ChildItem -Exclude .git | Remove-Item -Recurse -Force
          Copy-Item -Recurse /tmp/allure-report/* ./
          git add .
          git commit -m "Deploy Allure Report to Pages"
          git push https://${{ secrets.SECRET_TOKEN }}@gitverse.ru/Kirill-Kamyshanov/memes gh-pages --force

